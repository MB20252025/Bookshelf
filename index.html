<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookshelf – PC + Decor</title>
  <style>
    /* ---------- RESET ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;          /* No scroll on either device */
      background-color: #2c1a12; /* Fallback colour (visible on PC sides) */
    }

    /* ---------- APP CONTAINER ---------- */
    #app {
      width: 100vw;
      height: 100vh;
      display: block;            /* Phone: normal block layout */
    }

    /* ---------- BOOKSHELF (PHONE DEFAULT) ---------- */
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url('sbackground.png');  /* <-- EDIT: background file */
      background-size: cover;                    /* Phone: fills screen */
      background-position: center;
      background-repeat: no-repeat;
      background-color: #2c1a12;  /* fallback if image missing */
    }

    /* ---------- SIDE DECORATIONS (HIDDEN ON PHONE) ---------- */
    .decor-container {
      display: none;             /* Phone: completely hidden */
      height: 100vh;
      overflow: hidden;
      align-items: center;
      justify-content: center;
      background-color: #2c1a12; /* matches fallback */
    }
    .decor-container img {
      height: 100%;
      width: auto;
      flex-shrink: 0;
    }

    /* ---------- 🖥️  PC OVERRIDES ---------- */
    @media (min-width: 1024px) {
      #app {
        display: flex;
        align-items: stretch;    /* full height */
        justify-content: center;
      }

      .scene {
        width: auto;
        height: 100vh;
        max-width: 1300px;       /* <-- EDIT: max width of bookcase on PC */
        flex-shrink: 0;
        background-size: contain; /* Shows ENTIRE bookcase, no cropping */
        background-position: center;
      }

      .decor-container {
        display: flex;           /* PC: show side decorations */
        flex: 1 1 0;            /* takes all remaining left/right space */
      }
    }
  </style>
</head>
<body>
  <!-- APP WRAPPER -->
  <div id="app">
    <!-- Left decoration (PC only) -->
    <div id="decor-left" class="decor-container"></div>

    <!-- The actual bookshelf -->
    <div class="scene" id="bookshelf">
      <!-- Books are injected here by JavaScript -->
    </div>

    <!-- Right decoration (PC only) -->
    <div id="decor-right" class="decor-container"></div>
  </div>

  <script>
    // ================================================================
    //  📚  SECTION 1 – BOOK POSITION & SCALE (PC ONLY)
    //  Edit these values to adjust books on a wide screen.
    //  Phone uses the raw x, y, scale from booksData (ignores these).
    // ================================================================
    const BOOKS_PC_CONFIG = {
      posMultiplierX: 2.8,   // Spread books wider (1.0 = phone spacing)
      posMultiplierY: 2.2,   // Spread books taller
      scaleMultiplier: 2.0,  // Make books bigger
      offsetX: 40,           // Move all books right (+) or left (-)
      offsetY: 10,           // Move all books down (+) or up (-)
    };

    // ================================================================
    //  🖼️  SECTION 2 – PC SIDE DECORATIONS (images left & right)
    //  Edit file names, scale, and position offsets.
    // ================================================================
    const PC_DECOR_CONFIG = {
      leftImage: "decor-left.png",    // <-- EDIT: left filler image
      rightImage: "decor-right.png",  // <-- EDIT: right filler image
      scale: 1.0,                     // Zoom in/out (1.0 = original)
      leftOffsetX: 0,                 // Shift left image horizontally (px)
      leftOffsetY: 0,                 // Shift left image vertically (px)
      rightOffsetX: 0,                // Shift right image horizontally (px)
      rightOffsetY: 0,                // Shift right image vertically (px)
    };

    // ---------- PC ACTIVATION ----------
    const PC_BREAKPOINT = 1024;        // Screen width above this = PC mode
    const isPC = window.innerWidth > PC_BREAKPOINT;

    // ================================================================
    //  📖  YOUR BOOK DATA (keep this as your phone‑perfect setup)
    // ================================================================
    const booksData = [
      // Row 1
      { src: "book1.png",  x: 20,  y: 80,  scale: 0.7 },
      { src: "book2.png",  x: 90,  y: 80,  scale: 0.7 },
      { src: "book3.png",  x: 160, y: 80,  scale: 0.7 },
      { src: "book4.png",  x: 230, y: 80,  scale: 0.7 },
      { src: "book5.png",  x: 300, y: 80,  scale: 0.7 },
      { src: "book6.png",  x: 370, y: 80,  scale: 0.7 },
      { src: "book7.png",  x: 440, y: 80,  scale: 0.7 },
      { src: "book8.png",  x: 510, y: 80,  scale: 0.7 },
      { src: "book9.png",  x: 580, y: 80,  scale: 0.7 },
      { src: "book10.png", x: 650, y: 80,  scale: 0.7 },
      { src: "book11.png", x: 720, y: 80,  scale: 0.7 },
      // Row 2
      { src: "book12.png", x: 20,  y: 200, scale: 0.7 },
      { src: "book13.png", x: 90,  y: 200, scale: 0.7 },
      { src: "book14.png", x: 160, y: 200, scale: 0.7 },
      { src: "book15.png", x: 230, y: 200, scale: 0.7 },
      { src: "book16.png", x: 300, y: 200, scale: 0.7 },
      { src: "book17.png", x: 370, y: 200, scale: 0.7 },
      { src: "book18.png", x: 440, y: 200, scale: 0.7 },
      { src: "book19.png", x: 510, y: 200, scale: 0.7 },
      { src: "book20.png", x: 580, y: 200, scale: 0.7 },
      { src: "book21.png", x: 650, y: 200, scale: 0.7 },
      { src: "book22.png", x: 720, y: 200, scale: 0.7 },
      // Row 3
      { src: "book23.png", x: 20,  y: 320, scale: 0.7 },
      { src: "book24.png", x: 90,  y: 320, scale: 0.7 },
      { src: "book25.png", x: 160, y: 320, scale: 0.7 },
      { src: "book26.png", x: 230, y: 320, scale: 0.7 },
      { src: "book27.png", x: 300, y: 320, scale: 0.7 },
      { src: "book28.png", x: 370, y: 320, scale: 0.7 },
      { src: "book29.png", x: 440, y: 320, scale: 0.7 },
      { src: "book30.png", x: 510, y: 320, scale: 0.7 },
      { src: "book31.png", x: 580, y: 320, scale: 0.7 },
      { src: "book32.png", x: 650, y: 320, scale: 0.7 },
      { src: "book33.png", x: 720, y: 320, scale: 0.7 },
      // Row 4
      { src: "book46.png", x: 20,  y: 440, scale: 0.7 },
      { src: "book48.png", x: 90,  y: 440, scale: 0.7 },
      { src: "book49.png", x: 160, y: 440, scale: 0.7 },
      { src: "book50.png", x: 230, y: 440, scale: 0.7 },
      { src: "book51.png", x: 300, y: 440, scale: 0.7 },
      { src: "book52.png", x: 370, y: 440, scale: 0.7 },
      { src: "book53.png", x: 440, y: 440, scale: 0.7 },
      { src: "book55.png", x: 510, y: 440, scale: 0.7 },
      { src: "book56.png", x: 580, y: 440, scale: 0.7 },
      { src: "book57.png", x: 650, y: 440, scale: 0.7 },
      { src: "book58.png", x: 720, y: 440, scale: 0.7 },
    ];

    // ================================================================
    //  🚀  BUILD – DO NOT EDIT BELOW (unless you know what you're doing)
    // ================================================================

    // ----- 1. Inject books -----
    const shelf = document.getElementById('bookshelf');
    booksData.forEach(book => {
      const img = document.createElement('img');
      img.className = 'book';
      img.src = book.src;
      img.alt = book.src;

      let x = book.x;
      let y = book.y;
      let scale = book.scale;

      if (isPC) {
        x = (book.x * BOOKS_PC_CONFIG.posMultiplierX) + BOOKS_PC_CONFIG.offsetX;
        y = (book.y * BOOKS_PC_CONFIG.posMultiplierY) + BOOKS_PC_CONFIG.offsetY;
        scale = book.scale * BOOKS_PC_CONFIG.scaleMultiplier;
      }

      img.style.position = 'absolute';
      img.style.left = x + 'px';
      img.style.top = y + 'px';
      img.style.transform = `scale(${scale})`;
      img.style.transformOrigin = 'top left';
      shelf.appendChild(img);
    });

    // ----- 2. Inject PC side decorations (only if PC mode) -----
    if (isPC) {
      const leftContainer = document.getElementById('decor-left');
      const rightContainer = document.getElementById('decor-right');

      // Left decoration
      const leftImg = document.createElement('img');
      leftImg.src = PC_DECOR_CONFIG.leftImage;
      leftImg.alt = 'Left decor';
      leftImg.style.transform = `scale(${PC_DECOR_CONFIG.scale})`;
      leftImg.style.marginLeft = PC_DECOR_CONFIG.leftOffsetX + 'px';
      leftImg.style.marginTop = PC_DECOR_CONFIG.leftOffsetY + 'px';
      leftContainer.appendChild(leftImg);

      // Right decoration
      const rightImg = document.createElement('img');
      rightImg.src = PC_DECOR_CONFIG.rightImage;
      rightImg.alt = 'Right decor';
      rightImg.style.transform = `scale(${PC_DECOR_CONFIG.scale})`;
      rightImg.style.marginRight = PC_DECOR_CONFIG.rightOffsetX + 'px';
      rightImg.style.marginTop = PC_DECOR_CONFIG.rightOffsetY + 'px';
      rightContainer.appendChild(rightImg);
    }

    // Log which mode is active
    console.log(isPC ? '🖥️  PC mode (books + decor active)' : '📱  Phone mode');
  </script>
</body>
</html>
