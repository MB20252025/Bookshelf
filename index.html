<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookshelf – PC Fixed</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;  /* Prevents any scrolling on both phone & PC */
    }

    /* ---------- BASE (PHONE / DEFAULT) ---------- */
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;            /* Fixed height – no extra space to scroll */
      background-image: url('sbackground.png');  /* <-- EDIT: background file */
      background-size: cover;   /* Phone: fills screen beautifully */
      background-position: center;
      background-repeat: no-repeat;
      box-sizing: border-box;
    }

    /* ---------- 🖥️  PC OVERRIDES (auto-applied for wide screens) ---------- */
    @media (min-width: 1024px) {
      .scene {
        /* 1) Show the ENTIRE bookcase without cropping */
        background-size: contain;
        background-position: center;

        /* 2) Keep it a reasonable width (prevents over‑stretching) */
        max-width: 1300px;      /* <-- EDIT: adjust to your monitor preference */
        margin: 0 auto;         /* centers it horizontally */

        /* 3) Lock height to viewport – no vertical scroll */
        height: 100vh;
      }
    }

    .book {
      position: absolute;
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <div class="scene" id="bookshelf"></div>

  <script>
    // ================================================================
    //  📱  PHONE = 1.0   |   🖥️  PC = values below
    //  Edit these two numbers to make books bigger / spread out on PC
    // ================================================================
    const PC_POS_MULTIPLIER = 1.6;   // Spread books wider (start with 1.6)
    const PC_SCALE_MULTIPLIER = 1.4; // Make books larger (start with 1.4)
    const PC_BREAKPOINT = 1024;
    // ================================================================

    // ---------- YOUR BOOK DATA (phone‑perfect, keep as‑is) ----------
    const booksData = [
      // Row 1
      { src: "book1.png",  x: 10,  y: 28,  scale: 0.25 },
      { src: "book2.png",  x: 26,  y: 28,  scale: 0.25 },
      { src: "book3.png",  x: 35, y: 28,  scale: 0.25 },
      { src: "book4.png",  x: 50, y: 28,  scale: 0.25 },
      { src: "book5.png",  x: 65, y: 28,  scale: 0.25 },
      { src: "book6.png",  x: 80, y: 28,  scale: 0.25 },
      { src: "book7.png",  x: 95, y: 28,  scale: 0.25 },
      { src: "book8.png",  x: 110, y: 28,  scale: 0.25 },
      { src: "book9.png",  x: 125, y: 28,  scale: 0.25 },
      { src: "book10.png", x: 140, y: 28,  scale: 0.25 },
      { src: "book11.png", x: 155, y: 28,  scale: 0.25 },
      // Row 2
      { src: "book12.png", x: 20,  y: 200, scale: 0.7 },
      { src: "book13.png", x: 90,  y: 200, scale: 0.7 },
      { src: "book14.png", x: 160, y: 200, scale: 0.7 },
      { src: "book15.png", x: 230, y: 200, scale: 0.7 },
      { src: "book16.png", x: 300, y: 200, scale: 0.7 },
      { src: "book17.png", x: 370, y: 200, scale: 0.7 },
      { src: "book18.png", x: 440, y: 200, scale: 0.7 },
      { src: "book19.png", x: 510, y: 200, scale: 0.7 },
      { src: "book20.png", x: 580, y: 200, scale: 0.7 },
      { src: "book21.png", x: 650, y: 200, scale: 0.7 },
      { src: "book22.png", x: 720, y: 200, scale: 0.7 },
      // Row 3
      { src: "book23.png", x: 20,  y: 320, scale: 0.7 },
      { src: "book24.png", x: 90,  y: 320, scale: 0.7 },
      { src: "book25.png", x: 160, y: 320, scale: 0.7 },
      { src: "book26.png", x: 230, y: 320, scale: 0.7 },
      { src: "book27.png", x: 300, y: 320, scale: 0.7 },
      { src: "book28.png", x: 370, y: 320, scale: 0.7 },
      { src: "book29.png", x: 440, y: 320, scale: 0.7 },
      { src: "book30.png", x: 510, y: 320, scale: 0.7 },
      { src: "book31.png", x: 580, y: 320, scale: 0.7 },
      { src: "book32.png", x: 650, y: 320, scale: 0.7 },
      { src: "book33.png", x: 720, y: 320, scale: 0.7 },
      // Row 4
      { src: "book46.png", x: 20,  y: 440, scale: 0.7 },
      { src: "book48.png", x: 90,  y: 440, scale: 0.7 },
      { src: "book49.png", x: 160, y: 440, scale: 0.7 },
      { src: "book50.png", x: 230, y: 440, scale: 0.7 },
      { src: "book51.png", x: 300, y: 440, scale: 0.7 },
      { src: "book52.png", x: 370, y: 440, scale: 0.7 },
      { src: "book53.png", x: 440, y: 440, scale: 0.7 },
      { src: "book55.png", x: 510, y: 440, scale: 0.7 },
      { src: "book56.png", x: 580, y: 440, scale: 0.7 },
      { src: "book57.png", x: 650, y: 440, scale: 0.7 },
      { src: "book58.png", x: 720, y: 440, scale: 0.7 },
    ];

    // ================================================================
    //  🚀  BUILD – auto‑detects screen width
    // ================================================================
    const isPC = window.innerWidth > PC_BREAKPOINT;
    const posMult = isPC ? PC_POS_MULTIPLIER : 1.0;
    const scaleMult = isPC ? PC_SCALE_MULTIPLIER : 1.0;

    const shelf = document.getElementById('bookshelf');
    booksData.forEach(book => {
      const img = document.createElement('img');
      img.className = 'book';
      img.src = book.src;
      img.alt = book.src;
      img.style.left = (book.x * posMult) + 'px';
      img.style.top = (book.y * posMult) + 'px';
      img.style.transform = `scale(${book.scale * scaleMult})`;
      shelf.appendChild(img);
    });

    console.log(isPC ? '🖥️  PC mode' : '📱  Phone mode');
  </script>
</body>
</html>
