<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookshelf – PC with Side Decor</title>
  <style>
    /* ---------- RESET ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;          /* No scroll on either device */
      background-color: #1a0f0a; /* Dark wood fill (visible on PC sides) */
    }

    /* ---------- APP CONTAINER ---------- */
    #app {
      width: 100vw;
      height: 100vh;
      display: block;            /* Phone: normal block layout */
    }

    /* ---------- BOOKSHELF (PHONE DEFAULT) ---------- */
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url('sbackground.jpg');  /* <-- EDIT: background file */
      background-size: cover;                    /* Phone: fills screen */
      background-position: center;
      background-repeat: no-repeat;
    }

    /* ---------- SIDE DECORATIONS (HIDDEN ON PHONE) ---------- */
    .pc-decor {
      display: none;             /* Phone: completely hidden */
    }

    /* ---------- 🖥️  PC OVERRIDES ---------- */
    @media (min-width: 1024px) {
      #app {
        display: flex;           /* PC: side-by-side layout */
        align-items: center;
        justify-content: center;
        gap: 0;                  /* No gap between elements */
      }

      .scene {
        width: auto;
        height: 100vh;
        max-width: 1300px;       /* <-- EDIT: max width of bookcase on PC */
        flex-shrink: 0;          /* Prevents squashing */
        background-size: contain; /* Shows ENTIRE bookcase, no cropping */
        background-position: center;
      }

      .pc-decor {
        display: block;          /* PC: show side decorations */
        height: 100vh;
        flex: 1 1 auto;          /* Takes up remaining left/right space */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      /* Individual decor images – edit the URLs below */
      #decor-left {
        background-image: url('decor-left.png');   /* <-- EDIT: left filler image */
      }
      #decor-right {
        background-image: url('decor-right.png');  /* <-- EDIT: right filler image */
      }
    }

    /* ---------- BOOK STYLES ---------- */
    .book {
      position: absolute;
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <!-- APP WRAPPER -->
  <div id="app">
    <!-- Left decoration (PC only) -->
    <div id="decor-left" class="pc-decor"></div>

    <!-- The actual bookshelf -->
    <div class="scene" id="bookshelf">
      <!-- Books will be injected here by JavaScript -->
    </div>

    <!-- Right decoration (PC only) -->
    <div id="decor-right" class="pc-decor"></div>
  </div>

  <script>
    // ================================================================
    //  📱  PHONE = uses exact x, y, scale from booksData
    //  🖥️  PC   = uses multipliers + offsets below
    // ================================================================
    const PC_CONFIG = {
      // --- Spread & size ---
      posMultiplierX: 2.8,   // Increase → books spread wider apart
      posMultiplierY: 2.2,   // Increase → books spread taller
      scaleMultiplier: 2.0,  // Increase → books get bigger

      // --- Fine-tuning offset (nudge all books) ---
      offsetX: 40,           // Positive = move right, Negative = move left
      offsetY: 10,           // Positive = move down, Negative = move up

      // --- Activate PC mode above this screen width ---
      breakpoint: 1024,
    };

    // ---------- YOUR BOOK DATA (keep this as your phone‑perfect setup) ----------
    const booksData = [
      // Row 1
      { src: "book1.png",  x: 10,  y: 28,  scale: 0.25 },
      { src: "book2.png",  x: 26,  y: 28,  scale: 0.25 },
      { src: "book3.png",  x: 35, y: 28,  scale: 0.25 },
      { src: "book4.png",  x: 50, y: 28,  scale: 0.25 },
      { src: "book5.png",  x: 65, y: 28,  scale: 0.25 },
      { src: "book6.png",  x: 80, y: 28,  scale: 0.25 },
      { src: "book7.png",  x: 440, y: 80,  scale: 0.7 },
      { src: "book8.png",  x: 510, y: 80,  scale: 0.7 },
      { src: "book9.png",  x: 580, y: 80,  scale: 0.7 },
      { src: "book10.png", x: 650, y: 80,  scale: 0.7 },
      { src: "book11.png", x: 720, y: 80,  scale: 0.7 },
      // Row 2
      { src: "book12.png", x: 20,  y: 200, scale: 0.7 },
      { src: "book13.png", x: 90,  y: 200, scale: 0.7 },
      { src: "book14.png", x: 160, y: 200, scale: 0.7 },
      { src: "book15.png", x: 230, y: 200, scale: 0.7 },
      { src: "book16.png", x: 300, y: 200, scale: 0.7 },
      { src: "book17.png", x: 370, y: 200, scale: 0.7 },
      { src: "book18.png", x: 440, y: 200, scale: 0.7 },
      { src: "book19.png", x: 510, y: 200, scale: 0.7 },
      { src: "book20.png", x: 580, y: 200, scale: 0.7 },
      { src: "book21.png", x: 650, y: 200, scale: 0.7 },
      { src: "book22.png", x: 720, y: 200, scale: 0.7 },
      // Row 3
      { src: "book23.png", x: 20,  y: 320, scale: 0.7 },
      { src: "book24.png", x: 90,  y: 320, scale: 0.7 },
      { src: "book25.png", x: 160, y: 320, scale: 0.7 },
      { src: "book26.png", x: 230, y: 320, scale: 0.7 },
      { src: "book27.png", x: 300, y: 320, scale: 0.7 },
      { src: "book28.png", x: 370, y: 320, scale: 0.7 },
      { src: "book29.png", x: 440, y: 320, scale: 0.7 },
      { src: "book30.png", x: 510, y: 320, scale: 0.7 },
      { src: "book31.png", x: 580, y: 320, scale: 0.7 },
      { src: "book32.png", x: 650, y: 320, scale: 0.7 },
      { src: "book33.png", x: 720, y: 320, scale: 0.7 },
      // Row 4
      { src: "book46.png", x: 20,  y: 440, scale: 0.7 },
      { src: "book48.png", x: 90,  y: 440, scale: 0.7 },
      { src: "book49.png", x: 160, y: 440, scale: 0.7 },
      { src: "book50.png", x: 230, y: 440, scale: 0.7 },
      { src: "book51.png", x: 300, y: 440, scale: 0.7 },
      { src: "book52.png", x: 370, y: 440, scale: 0.7 },
      { src: "book53.png", x: 440, y: 440, scale: 0.7 },
      { src: "book55.png", x: 510, y: 440, scale: 0.7 },
      { src: "book56.png", x: 580, y: 440, scale: 0.7 },
      { src: "book57.png", x: 650, y: 440, scale: 0.7 },
      { src: "book58.png", x: 720, y: 440, scale: 0.7 },
    ];

    // ================================================================
    //  🚀  BUILD – DO NOT EDIT BELOW (unless you know what you're doing)
    // ================================================================
    const isPC = window.innerWidth > PC_CONFIG.breakpoint;

    const shelf = document.getElementById('bookshelf');

    booksData.forEach(book => {
      const img = document.createElement('img');
      img.className = 'book';
      img.src = book.src;
      img.alt = book.src;

      let x = book.x;
      let y = book.y;
      let scale = book.scale;

      if (isPC) {
        x = (book.x * PC_CONFIG.posMultiplierX) + PC_CONFIG.offsetX;
        y = (book.y * PC_CONFIG.posMultiplierY) + PC_CONFIG.offsetY;
        scale = book.scale * PC_CONFIG.scaleMultiplier;
      }

      img.style.left = x + 'px';
      img.style.top = y + 'px';
      img.style.transform = `scale(${scale})`;
      shelf.appendChild(img);
    });

    // Log which mode is active (helps with debugging)
    console.log(isPC ? '🖥️  PC mode (decorations active)' : '📱  Phone mode');
  </script>
</body>
</html>
