<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookshelf – PC Centered (Fixed)</title>
  <style>
    /* ---------- RESET ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;          /* No scroll on any device */
      background-color: #2c1a12; /* Fallback (visible on PC sides if no decor) */
    }

    /* ---------- FLEX CONTAINER (centers everything) ---------- */
    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
      align-items: stretch;
      justify-content: center;
    }

    /* ---------- THE BOOKSHELF (default = mobile full screen) ---------- */
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url('sbackground.jpg');  /* <-- your background */
      background-size: cover;                    /* mobile: fills screen */
      background-position: center;
      background-repeat: no-repeat;
      background-color: #2c1a12;                 /* fallback */
      flex-shrink: 0;
    }

    /* ---------- SIDE DECORATIONS (hidden on mobile) ---------- */
    .decor-container {
      display: none;             /* hidden on phones */
      height: 100vh;
      flex: 1 1 0;              /* takes remaining space */
      overflow: hidden;
      background-color: #2c1a12;
      align-items: center;
      justify-content: center;
    }
    .decor-container img {
      height: 100%;
      width: auto;
      flex-shrink: 0;
    }

    /* ---------- 🖥️  PC OVERRIDES (FIXED) ---------- */
    @media (min-width: 1024px) {
      .scene {
        width: 100%;             /* ✅ FIX: gives the container width */
        max-width: 1300px;       /* <-- EDIT: how wide you want the bookcase on PC */
        height: 100vh;
        flex: 1 1 0;            /* allows it to grow/shrink within max-width */
        background-size: contain; /* shows the ENTIRE bookcase, no cropping */
        background-position: center;
      }

      .decor-container {
        display: flex;           /* show side decorations on PC */
        flex: 1 1 0;            /* takes remaining left/right space */
      }
    }

    /* ---------- BOOK STYLES ---------- */
    .book {
      position: absolute;
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- LEFT DECORATION (PC only) -->
    <div id="decor-left" class="decor-container"></div>

    <!-- THE BOOKSHELF (background + books) -->
    <div class="scene" id="bookshelf"></div>

    <!-- RIGHT DECORATION (PC only) -->
    <div id="decor-right" class="decor-container"></div>
  </div>

  <script>
    // ================================================================
    //  📚  SECTION 1 – PC BOOK POSITION & SCALE
    //  Only applies when screen width > 1024px.
    //  Phone uses raw x, y, scale from booksData (ignores these).
    // ================================================================
    const BOOKS_PC = {
      posMultiplierX: 1,   // spread books wider
      posMultiplierY: 1,   // spread books taller
      scaleMultiplier: 0.9,  // make books larger
      offsetX: 68,           // nudge all books right (+) or left (-)
      offsetY: -02,           // nudge all books down (+) or up (-)
    };

    // ================================================================
    //  🖼️  SECTION 2 – PC SIDE DECORATION IMAGES
    //  These appear only on PC, left and right of the bookcase.
    // ================================================================
    const DECOR_PC = {
      leftImage: "decor-left.png",    // <-- set your image file name
      rightImage: "decor-right.png",  // <-- set your image file name
      scale: 1.0,                     // zoom of the decorations
      leftOffsetX: 0,                 // shift left image horizontally
      leftOffsetY: 0,                 // shift left image vertically
      rightOffsetX: 0,                // shift right image horizontally
      rightOffsetY: 0,                // shift right image vertically
    };

    // ================================================================
    //  📱  YOUR BOOK DATA – keep this as your phone-perfect setup
    // ================================================================
    const booksData = [
      // Row 1
      { src: "book1.png",  x: 14,  y: 29,  scale: 0.25 },
      { src: "book2.png",  x: 30,  y: 28,  scale: 0.25 },
      { src: "book3.png",  x: 41, y: 45.5,  scale: 0.22 },
      { src: "book4.png",  x: 58, y: 41.5,  scale: 0.23 },
      { src: "book5.png",  x: 78, y: 56.5,  scale: 0.20 },
      { src: "book6.png",  x: 93, y: 56,  scale: 0.20 },
      { src: "book7.png",  x: 108, y: 51,  scale: 0.21 },
      { src: "book8.png",  x: 123, y: 45,  scale: 0.22 },
      { src: "book9.png",  x: 133, y: 45,  scale: 0.22 },
      { src: "book10.png", x: 143, y: 35,  scale: 0.24 },
      { src: "book11.png", x: 158, y: 28,  scale: 0.25 },
      // Row 2
      { src: "book12.png", x: 10,  y: 212, scale: 0.24 },
      { src: "book13.png", x: 26,  y: 216, scale: 0.23 },
      { src: "book14.png", x: 43, y: 222, scale: 0.22 },
      { src: "book15.png", x: 58, y: 210, scale: 0.25 },
      { src: "book16.png", x: 73, y: 210, scale: 0.25 },
      { src: "book17.png", x: 88, y: 210, scale: 0.25 },
      { src: "book18.png", x: 103, y: 220, scale: 0.25 },
      { src: "book19.png", x: 118, y: 220, scale: 0.23 },
      { src: "book20.png", x: 128, y: 224, scale: 0.22 },
      { src: "book21.png", x: 138, y: 208, scale: 0.25 },
      { src: "book22.png", x: 158, y: 204, scale: 0.24 },
      // Row 3
      { src: "book23.png", x: 10,  y: 370, scale: 0.25 },
      { src: "book24.png", x: 26,  y: 370, scale: 0.25 },
      { src: "book25.png", x: 40, y: 370, scale: 0.25 },
      { src: "book26.png", x: 55, y: 370, scale: 0.25 },
      { src: "book27.png", x: 70, y: 400, scale: 0.20 },
      { src: "book28.png", x: 80, y: 370, scale: 0.25 },
      { src: "book29.png", x: 95, y: 400, scale: 0.20 },
      { src: "book30.png", x: 115, y: 390, scale: 0.25 },
      { src: "book31.png", x: 130, y: 370, scale: 0.25 },
      { src: "book32.png", x: 145, y: 400, scale: 0.20 },
      { src: "book33.png", x: 155, y: 390, scale: 0.25 },
      // Row 4
      { src: "book46.png", x: 10,  y: 580, scale: 0.25 },
      { src: "book48.png", x: 26,  y: 580, scale: 0.25 },
      { src: "book49.png", x: 40, y: 580, scale: 0.25 },
      { src: "book50.png", x: 55, y: 580, scale: 0.25 },
      { src: "book51.png", x: 70, y: 580, scale: 0.25 },
      { src: "book52.png", x: 80, y: 580, scale: 0.25 },
      { src: "book53.png", x: 95, y: 580, scale: 0.25 },
      { src: "book55.png", x: 115, y: 580, scale: 0.25 },
      { src: "book56.png", x: 130, y: 580, scale: 0.25 },
      { src: "book57.png", x: 145, y: 580, scale: 0.25 },
      { src: "book58.png", x: 155, y: 580, scale: 0.25 },
    ];

    // ================================================================
    //  🚀  BUILD – DO NOT EDIT BELOW
    // ================================================================

    const PC_BREAKPOINT = 1024;
    const isPC = window.innerWidth > PC_BREAKPOINT;

    // ---- Inject books ----
    const shelf = document.getElementById('bookshelf');
    booksData.forEach(book => {
      const img = document.createElement('img');
      img.className = 'book';
      img.src = book.src;
      img.alt = book.src;

      let x = book.x;
      let y = book.y;
      let scale = book.scale;

      if (isPC) {
        x = (book.x * BOOKS_PC.posMultiplierX) + BOOKS_PC.offsetX;
        y = (book.y * BOOKS_PC.posMultiplierY) + BOOKS_PC.offsetY;
        scale = book.scale * BOOKS_PC.scaleMultiplier;
      }

      img.style.left = x + 'px';
      img.style.top = y + 'px';
      img.style.transform = `scale(${scale})`;
      shelf.appendChild(img);
    });

    // ---- Inject side decorations (PC only) ----
    if (isPC) {
      const leftContainer = document.getElementById('decor-left');
      const rightContainer = document.getElementById('decor-right');

      if (DECOR_PC.leftImage) {
        const leftImg = document.createElement('img');
        leftImg.src = DECOR_PC.leftImage;
        leftImg.alt = 'Left decor';
        leftImg.style.transform = `scale(${DECOR_PC.scale})`;
        leftImg.style.marginLeft = DECOR_PC.leftOffsetX + 'px';
        leftImg.style.marginTop = DECOR_PC.leftOffsetY + 'px';
        leftContainer.appendChild(leftImg);
      }

      if (DECOR_PC.rightImage) {
        const rightImg = document.createElement('img');
        rightImg.src = DECOR_PC.rightImage;
        rightImg.alt = 'Right decor';
        rightImg.style.transform = `scale(${DECOR_PC.scale})`;
        rightImg.style.marginRight = DECOR_PC.rightOffsetX + 'px';
        rightImg.style.marginTop = DECOR_PC.rightOffsetY + 'px';
        rightContainer.appendChild(rightImg);
      }
    }

    console.log(isPC ? '🖥️ PC mode – bookcase centered' : '📱 Phone mode');
  </script>
</body>
</html>
