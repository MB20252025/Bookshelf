<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookshelf – Boxes with separate position & scale per state</title>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #2c1a12;
    }
    #app {
      display: flex;
      width: 100%;
      min-height: 100vh;
      align-items: stretch;
      justify-content: center;
      background-color: #2c1a12;
    }
    .scene {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      height: auto;
      background-image: url('sbackground.jpg');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      background-color: #2c1a12;
      flex-shrink: 0;
    }
    .decor-container {
      display: none;
      flex: 1 1 0;
      overflow: hidden;
      background-color: #2c1a12;
      align-items: center;
      justify-content: center;
    }
    .decor-container img {
      height: 100%;
      width: auto;
      flex-shrink: 0;
    }

    .book-item {
      position: absolute;
      pointer-events: auto;
      cursor: grab;
      transform-origin: top left;
    }
    .book-item img {
      display: block;
      pointer-events: none;
    }
    .book-item.sortable-chosen {
      opacity: 0.7;
      outline: 2px solid #ffd700;
      z-index: 100;
    }
    .book-item.sortable-ghost {
      opacity: 0.3;
    }

    .box-item {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      transform-origin: top left;
      z-index: 20;
      transition: left 0.2s ease, top 0.2s ease, transform 0.2s ease;
    }
    .box-item img {
      display: block;
      pointer-events: none;
    }

    @media (min-width: 1024px) {
      html, body {
        overflow: hidden;
        height: 100%;
      }
      #app {
        min-height: 0;
        height: 100vh;
        flex-direction: row;
      }
      .scene {
        max-width: 1300px;
        height: 100vh;
        min-height: 0;
        background-size: contain;
        background-position: center;
        flex: 1 1 0;
        width: 100%;
      }
      .decor-container {
        display: flex;
        flex: 1 1 0;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="decor-left" class="decor-container"></div>
    <div class="scene" id="bookshelfContainer"></div>
    <div id="decor-right" class="decor-container"></div>
  </div>

  <script>
    // ================================================================

    // ================================================================

    // ================================================================

    ];

    const rawBooksPC = [

      { src: "book12.png", x: 84,  y: 202,  scale: 0.21 },
      { src: "book13.png", x: 98,  y: 202,  scale: 0.21 },
      { src: "book14.png", x: 115, y: 197,  scale: 0.22 },
      { src: "book15.png", x: 128, y: 197,  scale: 0.22 },
      { src: "book16.png", x: 138, y: 197,  scale: 0.22 },
      { src: "book17.png", x: 153, y: 197,  scale: 0.22 },
      { src: "book18.png", x: 168, y: 197,  scale: 0.22 },
      { src: "book19.png", x: 183, y: 208,  scale: 0.20 },
      { src: "book20.png", x: 193, y: 211,  scale: 0.20 },
      { src: "book21.png", x: 213, y: 187,  scale: 0.22 },
      { src: "book22.png", x: 227, y: 193,  scale: 0.21 },
      { src: "book23.png", x: 84,  y: 325,  scale: 0.25 },
      { src: "book24.png", x: 98,  y: 325,  scale: 0.25 },
      { src: "book25.png", x: 115, y: 325,  scale: 0.25 },
      { src: "book26.png", x: 128, y: 325,  scale: 0.25 },
      { src: "book27.png", x: 138, y: 355,  scale: 0.20 },
      { src: "book28.png", x: 153, y: 325,  scale: 0.25 },
      { src: "book29.png", x: 168, y: 355,  scale: 0.20 },
      { src: "book30.png", x: 183, y: 338,  scale: 0.25 },
      { src: "book31.png", x: 193, y: 325,  scale: 0.25 },
      { src: "book32.png", x: 213, y: 355,  scale: 0.20 },
      { src: "book33.png", x: 227, y: 350,  scale: 0.25 },
      { src: "book46.png", x: 84,  y: 500,  scale: 0.25 },
      { src: "book48.png", x: 98,  y: 500,  scale: 0.25 },
      { src: "book49.png", x: 115, y: 500,  scale: 0.25 },
      { src: "book50.png", x: 128, y: 500,  scale: 0.25 },
      { src: "book51.png", x: 138, y: 500,  scale: 0.25 },
      { src: "book52.png", x: 153, y: 500,  scale: 0.25 },
      { src: "book53.png", x: 168, y: 500,  scale: 0.25 },
      { src: "book55.png", x: 183, y: 500,  scale: 0.25 },
      { src: "book56.png", x: 193, y: 500,  scale: 0.25 },
      { src: "book57.png", x: 213, y: 500,  scale: 0.25 },
      { src: "book58.png", x: 227, y: 500,  scale: 0.25 },
    ];

    // ================================================================
    //  📦  BOX DATA – now with separate position (x, y) and scale for each state
    //  Edit these values to fine‑tune the size and location of each state.
    // ================================================================
    const boxesDataMobile = [
      {
        id: 1,
        closedImg: "boxclosed1.png",
        openImg: "boxopen1.png",
        closedX: 255,  closedY: 120,  closedScale: 0.1,
        openX: 255,    openY: 120,    openScale: 0.1   // moves right & up when open
      },
      {
        id: 2,
        closedImg: "boxclosed2.png",
        openImg: "boxopen2.png",
        closedX: 255,  closedY: 299,  closedScale: 0.1,
        openX: 255,    openY: 299,    openScale: 0.1    // moves up when open
      },
      {
        id: 3,
        closedImg: "boxclosed3.png",
        openImg: "boxopen3.png",
        closedX: 255,  closedY: 470,  closedScale: 0.1,
        openX: 255,    openY: 470,    openScale: 0.1   // moves left when open
      },
      {
        id: 4,
        closedImg: "boxclosed4.png",
        openImg: "boxopen4.png",
        closedX: 255,  closedY: 640,  closedScale: 0.1,
        openX: 256,    openY: 633.2,    openScale: 0.085    // same position, same scale
      },
    ];

    const boxesDataPC = [
      // same as mobile for now – adjust separately if needed
      {
        id: 1,
        closedImg: "boxclosed1.png",
        openImg: "boxopen1.png",
        closedX: 255,  closedY: 120,  closedScale: 0.1,
        openX: 255,    openY: 120,    openScale: 0.1
      },
      {
        id: 2,
        closedImg: "boxclosed2.png",
        openImg: "boxopen2.png",
        closedX: 255,  closedY: 299,  closedScale: 0.1,
        openX: 255,    openY: 299,    openScale: 0.1
      },
      {
        id: 3,
        closedImg: "boxclosed3.png",
        openImg: "boxopen3.png",
        closedX: 255,  closedY: 470,  closedScale: 0.1,
        openX: 255,    openY: 470,    openScale: 0.1
      },
      {
        id: 4,
        closedImg: "boxclosed4.png",
        openImg: "boxopen4.png",
        closedX: 255,  closedY: 640,  closedScale: 0.1,
        openX: 255,    openY: 622.5,    openScale: 0.085
      },
    ];

    // ================================================================
    //  🖼️  PC SIDE DECORATIONS
    // ================================================================
    const DECOR_PC = {
      leftImage: "decor-left.png",
      rightImage: "decor-right.png",
      scale: 1.0,
      leftOffsetX: 0,
      leftOffsetY: 0,
      rightOffsetX: 0,
      rightOffsetY: 0,
    };

    // ================================================================
    //  🚀  BUILD – books + boxes (boxes are NOT draggable)
    // ================================================================
    const PC_BREAKPOINT = 1024;
    const isPC = window.innerWidth > PC_BREAKPOINT;
    const rawData = isPC ? rawBooksPC : rawBooksMobile;
    const boxesData = isPC ? boxesDataPC : boxesDataMobile;

    const SHELF_Y_MAP = [28, 212, 370, 550];
    function getShelfIndex(y) {
      let minDist = Infinity, idx = 0;
      SHELF_Y_MAP.forEach((sy, i) => {
        const d = Math.abs(y - sy);
        if (d < minDist) { minDist = d; idx = i; }
      });
      return idx;
    }

    const booksData = rawData.map((book, index) => {
      const shelf = getShelfIndex(book.y);
      return { ...book, shelf, order: index };
    });
    booksData.sort((a, b) => a.shelf - b.shelf || a.order - b.order);

    const container = document.getElementById('bookshelfContainer');
    const imageSizes = {};

    // ----- Render books -----
    function renderBooks() {
      container.querySelectorAll('.book-item').forEach(el => el.remove());

      const groups = {};
      booksData.forEach(book => {
        if (!groups[book.shelf]) groups[book.shelf] = [];
        groups[book.shelf].push(book);
      });

      const shelfKeys = Object.keys(groups).sort((a,b) => a-b);
      shelfKeys.forEach(shelfIdx => {
        const books = groups[shelfIdx];
        books.sort((a,b) => a.order - b.order);

        let currentX = 10;
        const xOffset = isPC ? PC_X_OFFSET : 0;

        books.forEach(book => {
          const size = imageSizes[book.src] || { width: 50, height: 50 };
          const scaledW = size.width * book.scale;
          const scaledH = size.height * book.scale;

          const item = document.createElement('div');
          item.className = 'book-item';
          item.dataset.src = book.src;
          item.style.left = (currentX + xOffset) + 'px';
          item.style.top = book.y + 'px';

          const img = document.createElement('img');
          img.src = book.src;
          img.alt = book.src;
          img.style.width = scaledW + 'px';
          img.style.height = scaledH + 'px';

          item.appendChild(img);
          container.appendChild(item);
          currentX += scaledW;
        });
      });

      if (window.sortableInstance) window.sortableInstance.destroy();
      window.sortableInstance = new Sortable(container, {
        group: 'books',
        animation: 150,
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        dragClass: 'sortable-drag',
        filter: '.box-item',
        preventOnFilter: false,
        onEnd: function(evt) {
          const movedSrc = evt.item.dataset.src;
          const book = booksData.find(b => b.src === movedSrc);
          if (!book) return;

          const rect = evt.item.getBoundingClientRect();
          const containerRect = container.getBoundingClientRect();
          const relativeY = rect.top - containerRect.top + window.scrollY;
          const newShelf = getShelfIndex(relativeY);
          book.shelf = newShelf;

          const items = container.querySelectorAll('.book-item');
          items.forEach((item, idx) => {
            const src = item.dataset.src;
            const b = booksData.find(b => b.src === src);
            if (b) b.order = idx;
          });

          renderBooks();
          renderBoxes();
        }
      });
    }

    // ----- Render boxes (with independent position and scale) -----
    function renderBoxes() {
      container.querySelectorAll('.box-item').forEach(el => el.remove());

      const xOffset = isPC ? PC_X_OFFSET : 0;

      boxesData.forEach(box => {
        const item = document.createElement('div');
        item.className = 'box-item';
        // Start with closed state
        const startX = box.closedX + xOffset;
        const startY = box.closedY;
        const startScale = box.closedScale || 0.3;
        item.style.left = startX + 'px';
        item.style.top = startY + 'px';
        item.style.transform = `scale(${startScale})`;
        item.style.transformOrigin = 'top left';

        const img = document.createElement('img');
        img.src = box.closedImg;
        img.alt = `Box ${box.id}`;
        img.dataset.closedImg = box.closedImg;
        img.dataset.openImg = box.openImg;
        img.dataset.isOpen = 'false';

        // Store the box data on the element for quick access
        item.dataset.boxId = box.id;

        img.onerror = function() {
          this.style.backgroundColor = '#ff0000';
          this.style.width = '100px';
          this.style.height = '100px';
          this.alt = 'Image missing';
        };

        // Click listener toggles image, position, and scale
        item.addEventListener('click', function(e) {
          e.stopPropagation();
          const img = this.querySelector('img');
          const isOpen = img.dataset.isOpen === 'true';
          const box = boxesData.find(b => b.id === parseInt(this.dataset.boxId, 10));
          if (!box) return;

          // Determine new state
          const newState = isOpen ? 'closed' : 'open';
          const newImg = isOpen ? box.closedImg : box.openImg;
          const newX = (isOpen ? box.closedX : box.openX) + xOffset;
          const newY = isOpen ? box.closedY : box.openY;
          const newScale = isOpen ? box.closedScale : box.openScale;

          // Apply changes
          img.src = newImg;
          img.dataset.isOpen = isOpen ? 'false' : 'true';
          this.style.left = newX + 'px';
          this.style.top = newY + 'px';
          this.style.transform = `scale(${newScale})`;

          console.log(`Box ${box.id} toggled to ${newState} (pos: ${newX},${newY} scale: ${newScale})`);
        });

        item.appendChild(img);
        container.appendChild(item);
      });
    }

    // ----- Load images (books) then render -----
    function loadImages(callback) {
      const promises = booksData.map(book => {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = function() {
            imageSizes[book.src] = { width: this.naturalWidth, height: this.naturalHeight };
            resolve();
          };
          img.onerror = function() {
            imageSizes[book.src] = { width: 100, height: 150 };
            resolve();
          };
          img.src = book.src;
        });
      });
      Promise.all(promises).then(callback);
    }

    // ---- Side decorations ----
    if (isPC) {
      const leftContainer = document.getElementById('decor-left');
      const rightContainer = document.getElementById('decor-right');
      if (DECOR_PC.leftImage) {
        const leftImg = document.createElement('img');
        leftImg.src = DECOR_PC.leftImage;
        leftImg.alt = 'Left decor';
        leftImg.style.transform = `scale(${DECOR_PC.scale})`;
        leftImg.style.marginLeft = DECOR_PC.leftOffsetX + 'px';
        leftImg.style.marginTop = DECOR_PC.leftOffsetY + 'px';
        leftContainer.appendChild(leftImg);
      }
      if (DECOR_PC.rightImage) {
        const rightImg = document.createElement('img');
        rightImg.src = DECOR_PC.rightImage;
        rightImg.alt = 'Right decor';
        rightImg.style.transform = `scale(${DECOR_PC.scale})`;
        rightImg.style.marginRight = DECOR_PC.rightOffsetX + 'px';
        rightImg.style.marginTop = DECOR_PC.rightOffsetY + 'px';
        rightContainer.appendChild(rightImg);
      }
    }

    // Start
    loadImages(() => {
      renderBooks();
      renderBoxes();
      console.log(isPC ? `🖥️ PC – box position & scale per state` : '📱 – box position & scale per state');
    });
  </script>

</html>
