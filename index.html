<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drag‑and‑Drop – Stable Sizes</title>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    /* ---------- RESET ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #2c1a12;
    }
    #app {
      display: flex;
      width: 100%;
      min-height: 100vh;
      align-items: stretch;
      justify-content: center;
      background-color: #2c1a12;
    }
    .scene {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      height: auto;
      background-image: url('sbackground.jpg');  /* <-- your background */
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      background-color: #2c1a12;
      flex-shrink: 0;
    }
    .decor-container {
      display: none;
      flex: 1 1 0;
      overflow: hidden;
      background-color: #2c1a12;
      align-items: center;
      justify-content: center;
    }
    .decor-container img {
      height: 100%;
      width: auto;
      flex-shrink: 0;
    }

    /* ---------- SHELF ROWS ---------- */
    .shelf-row {
      position: absolute;
      left: 10px;
      right: 10px;
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-end;    /* books sit on the bottom */
      gap: 0;                  /* no gaps */
      height: 120px;           /* adjust to your shelf height */
      pointer-events: none;
    }
    .shelf-row .book-item {
      pointer-events: auto;
      flex-shrink: 0;
      cursor: grab;
      display: flex;
      align-items: flex-end;
      height: 100%;            /* fill shelf height */
    }
    .shelf-row .book-item img {
      display: block;
      width: auto;
      /* height will be set dynamically via JavaScript */
      object-fit: contain;
      pointer-events: none;
    }
    /* drag styling */
    .shelf-row .book-item.sortable-chosen {
      opacity: 0.7;
      border: 2px solid #ffd700;
    }
    .shelf-row .book-item.sortable-ghost {
      opacity: 0.3;
    }

    /* ---------- PC OVERRIDES ---------- */
    @media (min-width: 1024px) {
      html, body {
        overflow: hidden;
        height: 100%;
      }
      #app {
        min-height: 0;
        height: 100vh;
        flex-direction: row;
      }
      .scene {
        max-width: 1300px;
        height: 100vh;
        min-height: 0;
        background-size: contain;
        background-position: center;
        flex: 1 1 0;
        width: 100%;
      }
      .decor-container {
        display: flex;
        flex: 1 1 0;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="decor-left" class="decor-container"></div>
    <div class="scene" id="bookshelfContainer"></div>
    <div id="decor-right" class="decor-container"></div>
  </div>

      // Row 4

      { src: "book58.png", shelf: 3, order: 10, scale: 0.25 },
    ];

    // ================================================================
    //  🖥️  PC BOOK DATA (same structure)
    // ================================================================
    const booksDataPC = [
      // Row 1
      { src: "book1.png",  shelf: 0, order: 0, scale: 0.22 },
      { src: "book2.png",  shelf: 0, order: 1, scale: 0.22 },
      { src: "book3.png",  shelf: 0, order: 2, scale: 0.19 },
      { src: "book4.png",  shelf: 0, order: 3, scale: 0.20 },
      { src: "book5.png",  shelf: 0, order: 4, scale: 0.17 },
      { src: "book6.png",  shelf: 0, order: 5, scale: 0.17 },

      // Row 2
      { src: "book12.png", shelf: 1, order: 0, scale: 0.21 },

      { src: "book18.png", shelf: 1, order: 6, scale: 0.22 },
      { src: "book19.png", shelf: 1, order: 7, scale: 0.20 },
      { src: "book20.png", shelf: 1, order: 8, scale: 0.20 },
      { src: "book21.png", shelf: 1, order: 9, scale: 0.22 },
      { src: "book22.png", shelf: 1, order: 10, scale: 0.21 },
      // Row 3
      { src: "book23.png", shelf: 2, order: 0, scale: 0.25 },
      { src: "book24.png", shelf: 2, order: 1, scale: 0.25 },
      { src: "book25.png", shelf: 2, order: 2, scale: 0.25 },
      { src: "book26.png", shelf: 2, order: 3, scale: 0.25 },
      { src: "book27.png", shelf: 2, order: 4, scale: 0.20 },
      { src: "book28.png", shelf: 2, order: 5, scale: 0.25 },
      { src: "book29.png", shelf: 2, order: 6, scale: 0.20 },
      { src: "book30.png", shelf: 2, order: 7, scale: 0.25 },
      { src: "book31.png", shelf: 2, order: 8, scale: 0.25 },
      { src: "book32.png", shelf: 2, order: 9, scale: 0.20 },
      { src: "book33.png", shelf: 2, order: 10, scale: 0.25 },
      // Row 4
      { src: "book46.png", shelf: 3, order: 0, scale: 0.25 },
      { src: "book48.png", shelf: 3, order: 1, scale: 0.25 },
      { src: "book49.png", shelf: 3, order: 2, scale: 0.25 },
      { src: "book50.png", shelf: 3, order: 3, scale: 0.25 },
      { src: "book51.png", shelf: 3, order: 4, scale: 0.25 },
      { src: "book52.png", shelf: 3, order: 5, scale: 0.25 },
      { src: "book53.png", shelf: 3, order: 6, scale: 0.25 },
      { src: "book55.png", shelf: 3, order: 7, scale: 0.25 },
      { src: "book56.png", shelf: 3, order: 8, scale: 0.25 },
      { src: "book57.png", shelf: 3, order: 9, scale: 0.25 },
      { src: "book58.png", shelf: 3, order: 10, scale: 0.25 },
    ];

    // ================================================================
    //  🖼️  PC SIDE DECORATIONS
    // ================================================================
    const DECOR_PC = {
      leftImage: "decor-left.png",
      rightImage: "decor-right.png",
      scale: 1.0,
      leftOffsetX: 0,
      leftOffsetY: 0,
      rightOffsetX: 0,
      rightOffsetY: 0,
    };

    // ================================================================
    //  🚀  BUILD
    // ================================================================
    const PC_BREAKPOINT = 1024;
    const isPC = window.innerWidth > PC_BREAKPOINT;
    const booksData = isPC ? booksDataPC : booksDataMobile;

    const container = document.getElementById('bookshelfContainer');
    const SHELF_HEIGHT = 120; // must match CSS .shelf-row height

    function groupByShelf(books) {
      const groups = {};
      books.forEach(book => {
        if (!groups[book.shelf]) groups[book.shelf] = [];
        groups[book.shelf].push(book);
      });
      for (const key in groups) {
        groups[key].sort((a, b) => a.order - b.order);
      }
      return groups;
    }

    function renderShelves() {
      container.querySelectorAll('.shelf-row').forEach(el => el.remove());

      const grouped = groupByShelf(booksData);
      const shelfKeys = Object.keys(grouped).sort((a,b) => a - b);

      shelfKeys.forEach(shelfIndex => {
        const shelfDiv = document.createElement('div');
        shelfDiv.className = 'shelf-row';
        shelfDiv.dataset.shelf = shelfIndex;
        const y = SHELF_Y[shelfIndex] || 0;
        shelfDiv.style.top = y + 'px';
        shelfDiv.style.height = SHELF_HEIGHT + 'px';

        const books = grouped[shelfIndex];
        books.forEach((book) => {
          const item = document.createElement('div');
          item.className = 'book-item';
          item.dataset.src = book.src;

          const img = document.createElement('img');
          img.src = book.src;
          img.alt = book.src;
          // Set explicit height = shelf height * scale
          const scale = book.scale || 1;
          img.style.height = (SHELF_HEIGHT * scale) + 'px';
          // width auto to preserve aspect ratio

          item.appendChild(img);
          shelfDiv.appendChild(item);
        });

        container.appendChild(shelfDiv);
      });

      // Init Sortable on each shelf
      document.querySelectorAll('.shelf-row').forEach(row => {
        new Sortable(row, {
          group: 'books',
          animation: 150,
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          dragClass: 'sortable-drag',
          onEnd: function(evt) {
            // Update data model after drop
            const shelf = parseInt(evt.to.dataset.shelf, 10);
            const movedSrc = evt.item.dataset.src;
            const book = booksData.find(b => b.src === movedSrc);
            if (!book) return;
            book.shelf = shelf;
            // Reassign orders based on current DOM order
            document.querySelectorAll('.shelf-row').forEach(row => {
              const shelfIdx = parseInt(row.dataset.shelf, 10);
              const items = row.querySelectorAll('.book-item');
              items.forEach((item, idx) => {
                const src = item.dataset.src;
                const b = booksData.find(b => b.src === src);
                if (b) b.order = idx;
              });
            });
            // Re-render to refresh sizes (optional, but ensures consistency)
            // We can just re-render; it's quick.
            renderShelves();
          }
        });
      });
    }

    // ---- Inject side decorations (PC only) ----
    if (isPC) {
      const leftContainer = document.getElementById('decor-left');
      const rightContainer = document.getElementById('decor-right');
      if (DECOR_PC.leftImage) {
        const leftImg = document.createElement('img');
        leftImg.src = DECOR_PC.leftImage;
        leftImg.alt = 'Left decor';
        leftImg.style.transform = `scale(${DECOR_PC.scale})`;
        leftImg.style.marginLeft = DECOR_PC.leftOffsetX + 'px';
        leftImg.style.marginTop = DECOR_PC.leftOffsetY + 'px';
        leftContainer.appendChild(leftImg);
      }
      if (DECOR_PC.rightImage) {
        const rightImg = document.createElement('img');
        rightImg.src = DECOR_PC.rightImage;
        rightImg.alt = 'Right decor';
        rightImg.style.transform = `scale(${DECOR_PC.scale})`;
        rightImg.style.marginRight = DECOR_PC.rightOffsetX + 'px';
        rightImg.style.marginTop = DECOR_PC.rightOffsetY + 'px';
        rightContainer.appendChild(rightImg);
      }
    }

    // Initial render
    renderShelves();
    console.log(isPC ? '🖥️ PC – stable sizes' : '📱 – stable sizes');
  </script>
</body>
</html>
