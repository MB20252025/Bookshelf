<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookshelf – Mobile Scroll, PC Fixed</title>
  <style>
    /* ---------- RESET ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      min-height: 100%;           /* allow content to stretch */
      background-color: #2c1a12;
    }

    /* ---------- APP CONTAINER ---------- */
    #app {
      display: flex;
      width: 100vw;
      min-height: 100vh;          /* mobile: at least full height, can grow */
      align-items: stretch;
      justify-content: center;
      background-color: #2c1a12;
    }

    /* ---------- THE BOOKSHELF (default = mobile) ---------- */
    .scene {
      position: relative;
      width: 100vw;
      min-height: 100vh;          /* mobile: can stretch taller */
      height: auto;               /* allow content to determine height */
      background-image: url('sbackground.jpg');  /* <-- your background */
      background-size: cover;
      background-position: center bottom;   /* show bottom */
      background-repeat: no-repeat;
      background-color: #2c1a12;
      flex-shrink: 0;
    }

    /* ---------- SIDE DECORATIONS (hidden on mobile) ---------- */
    .decor-container {
      display: none;
      flex: 1 1 0;
      overflow: hidden;
      background-color: #2c1a12;
      align-items: center;
      justify-content: center;
    }
    .decor-container img {
      height: 100%;
      width: auto;
      flex-shrink: 0;
    }

    /* ---------- 🖥️  PC OVERRIDES (no scroll, fixed height) ---------- */
    @media (min-width: 1024px) {
      html, body {
        overflow: hidden;         /* PC: no scroll */
        height: 100%;
      }
      #app {
        height: 100vh;            /* PC: fixed viewport height */
        min-height: 0;
        width: 100vw;
      }
      .scene {
        width: 100%;
        max-width: 1300px;        /* <-- edit bookcase max width on PC */
        height: 100vh;            /* fixed height */
        min-height: 0;
        background-size: contain;
        background-position: center;
        flex: 1 1 0;
      }
      .decor-container {
        display: flex;
        flex: 1 1 0;
      }
    }

    /* ---------- BOOK STYLES ---------- */
    .book {
      position: absolute;
      transform-origin: top left;
    }
  </style>
</head>

    // ================================================================
    const PC_BREAKPOINT = 1024;
    const isPC = window.innerWidth > PC_BREAKPOINT;
    const booksData = isPC ? booksDataPC : booksDataMobile;

    const shelf = document.getElementById('bookshelf');

    booksData.forEach(book => {

      img.src = book.src;

      img.style.top = book.y + 'px';
      img.style.transform = `scale(${book.scale})`;

    });
